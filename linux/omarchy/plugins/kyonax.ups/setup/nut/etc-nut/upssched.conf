# /etc/nut/upssched.conf (kyo-labs, 2026-09-29). The stock file is in /etc/nut.orig-*.
CMDSCRIPT /etc/nut/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Ride out short blips; after 3 minutes on battery, shut down cleanly.
AT ONBATT * START-TIMER onbatt-3min 180
AT ONLINE * CANCEL-TIMER onbatt-3min

# Log (and so notify) every event as it happens.
AT ONBATT   * EXECUTE onbatt
AT ONLINE   * EXECUTE online
AT LOWBATT  * EXECUTE lowbatt
AT FSD      * EXECUTE fsd
AT SHUTDOWN * EXECUTE shutdown
AT COMMBAD  * EXECUTE commbad
AT COMMOK   * EXECUTE commok
AT NOCOMM   * EXECUTE nocomm
AT REPLBATT * EXECUTE replbatt
