# Vale: house style for prose in Org and Markdown (Kyonax).
# Grammar is LTeX+'s job and spelling is jinx's, so this config only enforces
# the rules that are mine: banned buzzwords, tech-name casing, proselint's
# cliche and jargon checks.
# CV files (any path containing /documents/cv/) use cv.ini instead.
# Rule sources: ~/.brain.d/skills/cv-summary-writing/rules/
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Kyonax
Packages = proselint

# Emacs sends Org buffers as plain text with the Org syntax blanked out;
# Markdown, reStructuredText and AsciiDoc go in their own formats.
[*.{org,md,txt,rst,adoc}]
BasedOnStyles = Vale, Kyonax, proselint
# Spelling is checked by jinx in English and Spanish at once.
Vale.Spelling = NO
# Blanked-out inline code leaves gaps like "and   and"; LTeX+ checks repeats.
Vale.Repetition = NO
# Tech-name casing (JavaScript, GitHub) is a fix, not a blocker.
Vale.Terms = warning
# Plain characters are the house rule: " ' ... and -, never typographic ones.
proselint.Typography = NO
