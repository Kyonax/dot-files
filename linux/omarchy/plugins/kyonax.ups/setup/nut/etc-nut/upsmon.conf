# /etc/nut/upsmon.conf (kyo-labs, 2026-09-29). The stock file is in /etc/nut.orig-*.
# One UPS feeds this PC, and this PC shuts itself down.

MONITOR ups@localhost 1 upsmon @UPSMON_PASSWORD@ primary
MINSUPPLIES 1

# What "shut down" means here (runs as root).
SHUTDOWNCMD "/usr/bin/systemctl poweroff"

# Every event goes to upssched: the 3-minute on-battery timer, the journal
# line and the desktop notification all start there (/etc/nut/upssched.conf).
NOTIFYCMD /usr/bin/upssched

POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
FINALDELAY 5

# No POWERDOWNFLAG on purpose: the UPS is never told to cut its own outlets,
# so a shutdown that races with mains coming back can't leave the desk dark.

# Log and run upssched. No WALL: it would spray text into terminals and TUIs.
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+EXEC
NOTIFYFLAG COMMOK   SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+EXEC
NOTIFYFLAG REPLBATT SYSLOG+EXEC
