# /etc/nut/ups.conf (kyo-labs, 2026-09-29). The stock file is in /etc/nut.orig-*.
# The UPS on USB: 0925:1234, "RICHCOMM UPS USB Mon V2.0". nutdrv_qx is
# nut-scanner's first choice for it; richcomm_usb failed on this unit
# ("driver callback failed: Entity not found").
maxretry = 3

[ups]
	driver = nutdrv_qx
	port = auto
	vendorid = 0925
	productid = 1234
	desc = "Desk UPS (Richcomm USB Mon V2.0)"
