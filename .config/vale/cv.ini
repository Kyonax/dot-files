# Vale for CV files: the house style plus the CV recipe's rules.
# Emacs picks this file for any path containing /documents/cv/.
# Rule sources: ~/.brain.d/skills/cv-summary-writing/rules/six-hard-rules.md
# and anti-patterns.md.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = Kyonax
Packages = proselint, write-good

# Emacs sends Org buffers as plain text with the Org syntax blanked out;
# Markdown, reStructuredText and AsciiDoc go in their own formats.
[*.{org,md,txt,rst,adoc}]
BasedOnStyles = Vale, Kyonax, KyonaxCV, proselint, write-good
Vale.Spelling = NO
# Blanked-out inline code leaves gaps like "and   and"; LTeX+ checks repeats.
Vale.Repetition = NO
# Tech-name casing (JavaScript, GitHub) is a fix, not a blocker.
Vale.Terms = warning
proselint.Typography = NO
# Grammarly-style clarity hints from write-good: passive voice and "So"
# openers. Its wordiness, weasel-word, "There is" and cliche rules repeat what
# LTeX+ and proselint already flag, and E-Prime flags every form of "to be".
write-good.Passive = suggestion
write-good.So = suggestion
write-good.TooWordy = NO
write-good.Weasel = NO
write-good.ThereIs = NO
write-good.Cliches = NO
write-good.E-Prime = NO
write-good.Illusions = NO
